plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", (System.getenv("SKYCRAFT_USERNAME") ?: "Dovahkiin")
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Dskycraft.quitWithSkyrim=false"
		}
	}

	mods {
		"skycraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed"; exceptionFormat "full" }
}

// Opt-in integration client, excluded from the release JAR and ordinary development runs.
if (providers.gradleProperty("networkSmoke").isPresent()) {
	sourceSets {
		networkSmoke {
			compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
			runtimeClasspath += sourceSets.client.runtimeClasspath
		}
	}
	loom {
		mods {
			"skycraft-network-smoke" { sourceSet sourceSets.networkSmoke }
		}
		runs {
				networkSmokeClient {
				client()
				sourceSet = sourceSets.networkSmoke.name
					runDirectory = file(providers.gradleProperty("assistantWorldSmoke").isPresent() ? "../.tools/assistant-world-smoke" : "../.tools/network-smoke-game")
					vmArgs "--enable-native-access=ALL-UNNAMED", "-Dskycraft.startHidden=true", "-Dskycraft.quitWithSkyrim=false", "-Dskycraft.discordAppId=0", "-Dskycraft.link=Local\\SkyCraft_network_smoke"
					if (providers.gradleProperty("assistantWorldSmoke").isPresent()) vmArgs "-Dskycraft.assistantWorldSmoke=true", "-Dskycraft.link=Local\\SkyCraft_world_smoke"
				programArgs "--username", "NetworkSmoke"
			}
		}
	}
	if (providers.gradleProperty('gameplaySmoke').isPresent()) {
		loom.runs {
			gameplayHostClient {
				client(); sourceSet = sourceSets.networkSmoke.name
				runDirectory = '../.tools/gameplay-host'
				vmArgs '-Xmx512m', '-XX:ActiveProcessorCount=2', '-XX:ReservedCodeCacheSize=128m', '--enable-native-access=ALL-UNNAMED', '-Dskycraft.gameplaySmokeRole=host', '-Dskycraft.startHidden=true', '-Dskycraft.quitWithSkyrim=false', '-Dskycraft.discordAppId=0', '-Dskycraft.link=Local\\SkyCraft_gameplay_host'
				programArgs '--username', 'GameplayHost'
			}
			gameplayGuestClient {
				client(); sourceSet = sourceSets.networkSmoke.name
				runDirectory = '../.tools/gameplay-client'
				vmArgs '-Xmx512m', '-XX:ActiveProcessorCount=2', '-XX:ReservedCodeCacheSize=128m', '--enable-native-access=ALL-UNNAMED', '-Dskycraft.gameplaySmokeRole=client', '-Dskycraft.startHidden=true', '-Dskycraft.quitWithSkyrim=false', '-Dskycraft.discordAppId=0', '-Dskycraft.link=Local\\SkyCraft_gameplay_client'
				programArgs '--username', 'GameplayGuest'
			}
		}
		tasks.register('exportGameplayLaunch') {
			def exports = [tasks.named('runGameplayHostClient'), tasks.named('runGameplayGuestClient')]
			dependsOn exports.collectMany { it.get().taskDependencies.getDependencies(it.get()) }
			doLast { exports.each { provider ->
				def run = provider.get(); def jvm = run.allJvmArgs.findAll { !it.startsWith('@') }
				def launchArgs = jvm + ['-classpath',run.classpath.asPath,run.mainClass.get()] + run.args + ['--username', run.name.contains('Host')?'GameplayHost':'GameplayGuest']
				def argsFile = file("../.tools/${run.name}.args")
				argsFile.text = launchArgs.collect { '"' + it.replace('\\','\\\\').replace('"','\\"') + '"' }.join('\n')
				file("../.tools/${run.name}.json").text = groovy.json.JsonOutput.toJson([java:run.javaLauncher.get().executablePath.asFile.absolutePath,
					args:['@'+argsFile.absolutePath],
					workingDirectory:file('../.tools/gameplay-' + (run.name.contains('Host')?'host':'client')).absolutePath])
			} }
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
